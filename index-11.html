<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handwriting Work From Home | Neha Book Publication</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #f3e8ff, #fff7ed);
      color: #26324b;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
    }
    .container {
      width: min(92%, 700px);
      margin: 0 auto;
      padding: 36px 24px;
      background: #ffffff;
      border: 1px solid #e3e8f5;
      border-top: 6px solid #6d28d9;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(54, 45, 110, .12);
    }
    h1 {
      color: #4c1d95;
      margin: 0 0 12px;
      line-height: 1.25;
    }
    .brand {
      color: #0f766e;
      font-weight: bold;
      font-size: 18px;
    }
    p { margin: 12px 0; }
    .button {
      display: block;
      width: 100%;
      max-width: 420px;
      margin: 24px auto 0;
      padding: 20px 32px;
      border-radius: 10px;
      background: linear-gradient(90deg, #6d28d9, #2563eb);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 22px;
      line-height: 1.3;
      box-shadow: 0 6px 16px rgba(79, 70, 229, .28);
    }
    .button:hover { background: linear-gradient(90deg, #5b21b6, #1d4ed8); }
    footer { margin-top: 26px; color: #64748b; font-size: 14px; }
    @media (max-width: 480px) {
      .container { padding: 30px 18px; }
      h1 { font-size: 27px; }
      .button { font-size: 21px; padding: 19px 20px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Handwriting Work From Home</h1>
    <p class="brand">Neha Book Publication</p>
    <p>Interested in handwriting work? Contact us on Telegram to ask about the project, requirements, and terms.</p>
    <a class="button" href="https://t.me/NEHA_BOOK_PUBLICATION2/" target="_blank" rel="noopener noreferrer">Apply Now</a>
    <footer>© 2026 Neha Book Publication</footer>
  </main>
</body>
</html>
